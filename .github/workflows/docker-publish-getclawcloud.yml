name: Docker Publish(GetClawCloud)

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main

permissions:
  contents: read
  # Needed so the per-arch jobs can push/pull their registry-backed build
  # cache to ghcr.io (cache-to/cache-from type=registry) and push image
  # blobs by digest.
  packages: write

# Push/tag runs are never cancelled so every merge/tag gets its own image.
# PR runs reuse a PR-scoped group with cancel-in-progress so rapid pushes to
# the same PR collapse to the latest commit.
concurrency:
  group: docker-getclawcloud-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the lowercased GHCR image name once and share it with every job.
  # GHCR rejects uppercase characters, but ${{ github.repository }} can contain
  # them (e.g. GetClawCloud/...), so we normalise here.
  # ---------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.img.outputs.image }}
    steps:
      - name: Compute lowercase image name
        id: img
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY}"
          image=$(echo "${image}" | tr '[:upper:]' '[:lower:]')
          echo "image=${image}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Build amd64 natively on the default x86 runner.
  # ---------------------------------------------------------------------------
  build-amd64:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in so the registry-backed build cache below can be read on every
      # event and written on push/tag, and so digest blobs can be pushed.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PR builds: validate the image builds, read cache only (no push,
      # no cache write) so concurrent PRs don't race on the cache ref.
      - name: Build image (amd64, PR validation)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          build-args: |
            HERMES_GIT_SHA=${{ github.sha }}
          cache-from: type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-amd64

      # Push/tag builds: push by digest only (no tag) and read+write cache so
      # the next build starts warm. The merge job assembles the tagged manifest.
      - name: Build and push amd64 by digest
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            HERMES_GIT_SHA=${{ github.sha }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-amd64
          cache-to: type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-amd64,mode=max

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digest-amd64
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Build arm64 natively on GitHub's free arm64 runner. This avoids the slow
  # QEMU-emulated arm64 build (which was 5-10x slower) and runs in parallel
  # with the amd64 job.
  # ---------------------------------------------------------------------------
  build-arm64:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (arm64, PR validation)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: false
          build-args: |
            HERMES_GIT_SHA=${{ github.sha }}
          cache-from: type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-arm64

      - name: Build and push arm64 by digest
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            HERMES_GIT_SHA=${{ github.sha }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-arm64
          cache-to: type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-arm64,mode=max

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digest-arm64
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Stitch both per-arch digests into a single tagged multi-arch manifest.
  # Registry-side operation only (no building, no layer re-push) — runs fast.
  #
  # Tags:
  #   - always :latest
  #   - on a tag push (v*): :<tag name>
  #   - on a main push:     :sha-<full sha>
  # ---------------------------------------------------------------------------
  merge:
    needs: [prepare, build-amd64, build-arm64]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
        run: |
          set -euo pipefail
          # Assemble the per-digest source references for imagetools.
          args=()
          for digest_file in *; do
            args+=("${IMAGE}@sha256:${digest_file}")
          done

          # Always tag :latest.
          tag_args=(-t "${IMAGE}:latest")
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag_args+=(-t "${IMAGE}:${GITHUB_REF_NAME}")
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            tag_args+=(-t "${IMAGE}:sha-${GITHUB_SHA}")
          fi

          docker buildx imagetools create "${tag_args[@]}" "${args[@]}"

      - name: Inspect image
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
        run: |
          docker buildx imagetools inspect "${IMAGE}:latest"
